name: Build custom analysis images
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: custom-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set image repository
        run: echo "IMAGE_ROOT=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Initialize and verify pinned NASVAR source
        run: |
          git submodule update --init -- vendor/nasvar
          python3 - <<'PYTHON'
          import json, subprocess
          from pathlib import Path
          expected = json.loads(Path('dependencies.json').read_text())['nasvar']['commit']
          actual = subprocess.check_output(
              ['git', '-C', 'vendor/nasvar', 'rev-parse', 'HEAD'], text=True).strip()
          if actual != expected:
              raise SystemExit(f'NASVAR commit mismatch: expected {expected}, got {actual}')
          dirty = subprocess.check_output(
              ['git', '-C', 'vendor/nasvar', 'status', '--porcelain'], text=True).strip()
          if dirty:
              raise SystemExit('NASVAR checkout has local modifications')
          print(f'NASVAR source verified: {actual}')
          PYTHON
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve configured base images
        run: |
          python3 - <<'PYTHON'
          import json, os, re, subprocess
          from pathlib import Path
          sources = json.loads(Path('assets/container_bases.json').read_text())
          locked = {}
          for name, source in sources.items():
              result = subprocess.check_output(
                  ['docker', 'buildx', 'imagetools', 'inspect', source], text=True)
              match = re.search(r'^Digest:\s+(sha256:[a-f0-9]{64})\s*$', result, re.M)
              if not match:
                  raise SystemExit(f'{name}: registry did not return a digest')
              repository = source.split('@')[0]
              if ':' in repository.rsplit('/', 1)[-1]:
                  repository = repository.rsplit(':', 1)[0]
              locked[name] = repository + '@' + match.group(1)
          Path('container-bases.lock.json').write_text(json.dumps(locked, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              for name, reference in locked.items():
                  handle.write(f'{name.upper()}_IMAGE={reference}\n')
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: container-base-lock
          path: container-bases.lock.json
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/preprocess/Dockerfile
          platforms: linux/amd64
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ${{ env.IMAGE_ROOT }}:preprocess-${{ github.sha }}
          build-args: |
            DORADO_IMAGE=${{ env.DORADO_IMAGE }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nasvar/Dockerfile
          platforms: linux/amd64
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ${{ env.IMAGE_ROOT }}:nasvar-${{ github.sha }}
          build-args: |
            RUST_IMAGE=${{ env.RUST_IMAGE }}
            RUNTIME_IMAGE=${{ env.RUNTIME_IMAGE }}
      - name: Resolve release candidate image lock
        run: |
          python3 bin/lock_images.py \
            --preprocess "$IMAGE_ROOT:preprocess-$GITHUB_SHA" \
            --nasvar "$IMAGE_ROOT:nasvar-$GITHUB_SHA" \
            --output images.lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-image-lock
          path: images.lock.json
