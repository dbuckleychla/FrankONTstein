name: Validate workflow
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report-python-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      # Rocky Linux 9 preprocessing uses the system Python; newer Python accepts
      # f-string quote reuse that fails at import time on this runtime.
      - run: python -m compileall -q bin/adaptive_qc.py bin/report_presentation.py bin/sample_summary.py bin/make_report.py bin/preview_reports.py bin/read_length_qc.py
      - run: python -m unittest discover -s tests -p 'test_report_presentation.py' -v
      - run: python -m unittest discover -s tests -p 'test_sample_summary.py' -v
  workflow:
    strategy:
      fail-fast: false
      matrix:
        nextflow: ['25.10.2', '26.04.6']
    env:
      NXF_SYNTAX_PARSER: v2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nextflow }}
      - uses: nf-core/setup-nf-test@v1
        with:
          version: '0.9.2'
      - run: python3 bin/bootstrap.py
      - run: python3 bin/check_dependencies.py
      - run: sudo apt-get update && sudo apt-get install -y samtools bcftools
      - run: python3 -m pip install pysam==0.23.3
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.7.31'
      - run: python3 -m unittest discover -s tests -v
      - run: nextflow run tests/plan_checks.nf -lib lib
      - run: python3 tests/run_aws_environment_contracts.py
      - run: python3 tests/run_clair3_gpu_contracts.py
      - run: python3 tests/run_resource_contracts.py
      - run: python3 tests/run_contracts.py
      - run: python3 tests/run_basecall_contracts.py
      - run: python3 tests/run_consensus_contracts.py
      - run: nf-test test tests/reference.nf.test tests/basecalling.nf.test tests/deepsomatic.nf.test tests/finalize_variants.nf.test tests/consensus.nf.test
        env:
          FRANKONTSTEIN_TEST_ROOT: ${{ github.workspace }}
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - run: terraform -chdir=terraform/aws fmt -check
      - run: terraform -chdir=terraform/aws init -backend=false -input=false
      - run: terraform -chdir=terraform/aws validate
      - run: terraform -chdir=terraform/aws test
